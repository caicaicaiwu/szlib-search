<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>龙岗河碧道分馆图书查询</title>
</head>
<body style="text-align: center; padding-top: 50px; font-family: sans-serif;">
    <h2>龙岗河碧道分馆</h2>
    <input type="text" id="keyword" placeholder="请输入书名" style="padding: 10px; font-size: 16px; width: 70%;">
    <button onclick="searchBook()" style="padding: 10px; font-size: 16px;">搜索</button>

    <script>
        function searchBook() {
            var kw = document.getElementById('keyword').value.trim();
            if(!kw) { alert("请输入要搜索的书名"); return; }
            
            // 跳转到深图 PC 端，带上馆藏限定和技术员给的区馆代码
            var url = "https://www.szlib.org.cn/opac/search?q=" + encodeURIComponent(kw) 
                    + "&searchWay=title"
                    + "&v_local=LGF031"
                    + "&library=044120";
            
            window.location.href = url;
        }
    </script>
</body>
</html>
