<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>龙岗河碧道分馆图书查询</title>
    <style>
        body { font-family: sans-serif; padding: 15px; background-color: #f5f5f5; margin: 0; }
        .search-box { display: flex; margin-bottom: 20px; }
        input { flex: 1; padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 4px 0 0 4px; outline: none; }
        button { padding: 10px 20px; font-size: 16px; background-color: #007bff; color: white; border: none; border-radius: 0 4px 4px 0; }
        .book-item { background: white; padding: 15px; margin-bottom: 10px; border-radius: 6px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .book-title { font-weight: bold; color: #333; font-size: 16px; margin-bottom: 5px; }
        .book-info { color: #666; font-size: 13px; margin-bottom: 5px; }
        .book-actions { margin-top: 10px; border-top: 1px dashed #eee; padding-top: 10px; display: none; }
        .btn-detail { font-size: 14px; color: #007bff; background: none; border: none; padding: 0; cursor: pointer; }
        .holding-info { font-size: 14px; color: #333; margin-top: 8px; background: #f9f9f9; padding: 8px; border-radius: 4px; }
        .status-out { color: #d9534f; }
        .status-in { color: #5cb85c; }
        .loading { text-align: center; color: #999; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="search-box">
        <input type="text" id="keyword" placeholder="请输入书名，如：西游记">
        <button onclick="searchBook()">搜索</button>
    </div>
    <div id="result-container"></div>
    <div id="loading" class="loading" style="display:none;">正在查询...</div>

    <script>
        // 使用公共代理绕过跨域限制
        const PROXY = "https://api.allorigins.win/raw?url=";
        // 深图 API 基础地址
        const API_BASE = "https://www.szlib.org.cn/api/opacservice/";
        const CLIENT_ID = "t1";

        function searchBook() {
            var kw = document.getElementById('keyword').value.trim();
            if(!kw) { alert("请输入要搜索的书名"); return; }

            var container = document.getElementById('result-container');
            var loading = document.getElementById('loading');
            container.innerHTML = '';
            loading.style.display = 'block';

            // 拼接真实请求
            var realUrl = API_BASE + "getQueryResult?v_index=title"
                + "&v_value=" + encodeURIComponent(kw)
                + "&v_tablearray=bibliosm,serbibm,apabibibm,mmbibm,"
                + "&cirtype=&pageNum=20&v_local=LGF031&library=044120&client_id=" + CLIENT_ID;

            // 套上代理
            var fetchUrl = PROXY + encodeURIComponent(realUrl);

            fetch(fetchUrl)
                .then(res => res.json())
                .then(data => {
                    loading.style.display = 'none';
                    if (!data.data || !data.data.docs || data.data.docs.length === 0) {
                        container.innerHTML = '<div style="text-align:center;color:#999;margin-top:30px;">未找到相关图书</div>';
                        return;
                    }

                    let html = '';
                    let docs = Array.isArray(data.data.docs) ? data.data.docs : Object.values(data.data.docs);
                    
                    docs.forEach((book, index) => {
                        html += `
                            <div class="book-item">
                                <div class="book-title">${book.title}</div>
                                <div class="book-info">作者：${book.author || '未知'} | 出版社：${book.publisher || '未知'}</div>
                                <button class="btn-detail" onclick="getDetail('${book.recordid || book.id}', '${index}')">查看馆藏状态 >></button>
                                <div class="book-actions" id="actions-${index}"></div>
                            </div>
                        `;
                    });
                    container.innerHTML = html;
                })
                .catch(err => {
                    loading.style.display = 'none';
                    container.innerHTML = '<div style="text-align:center;color:red;margin-top:30px;">网络连接异常，请稍后再试</div>';
                });
        }

        function getDetail(metaid, index) {
            var actionsDiv = document.getElementById('actions-' + index);
            actionsDiv.style.display = 'block';
            actionsDiv.innerHTML = '正在获取...';

            var realDetailUrl = API_BASE + "getBookDetail?metaTable=bibliosm"
                + "&metaid=" + metaid
                + "&library=044120&v_local=LGF031&client_id=" + CLIENT_ID;

            var fetchDetailUrl = PROXY + encodeURIComponent(realDetailUrl);

            fetch(fetchDetailUrl)
                .then(res => res.json())
                .then(data => {
                    actionsDiv.innerHTML = '';
                    if (!data.data || !data.data.DistrictList) {
                        actionsDiv.innerHTML = '<div class="holding-info status-out">❌ 碧道分馆暂无此书的可借复本</div>';
                        return;
                    }

                    let hasBook = false;
                    let infoHtml = '';
                    data.data.DistrictList.forEach(district => {
                        if (district.InsideServiceAddr && district.InsideServiceAddr.length > 0) {
                            district.InsideServiceAddr.forEach(addrInfo => {
                                hasBook = true;
                                let statusClass = addrInfo.notes.includes('可外借') ? 'status-in' : 'status-out';
                                infoHtml += `<div class="holding-info ${statusClass}">
                                    📍 ${addrInfo.note}<br/>
                                    📊 ${addrInfo.notes}
                                </div>`;
                            });
                        }
                    });

                    if (hasBook && infoHtml !== '') {
                        actionsDiv.innerHTML = infoHtml;
                    } else {
                        actionsDiv.innerHTML = '<div class="holding-info status-out">❌ 此书在其他馆藏点，或已全部借出</div>';
                    }
                })
                .catch(err => {
                    actionsDiv.innerHTML = '<div class="holding-info status-out">获取失败</div>';
                });
        }
    </script>
</body>
</html>
